# Project's properties
project:
   title: Project Environment
   description: This is the project-environment project
   group: io.github.fireforce6-f25
   version: 0.1.0

# Maven repositories
repositories:
   - https://repo.maven.apache.org/maven2

# Maven dependencies
dependencies:
   - io.github.fireforce6:sierra-method:0.1.0

# Project's datasets
datasets:
   project-environment: # configured in fuseki.ttl
      label: Project Environment
      description: The set of ontologies in this project-environment project
      iri: https://fireforce6.github.io/project-environment/bundle
      sources: [ 'src/oml' ]
      queries: src/sparql
